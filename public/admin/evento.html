<!doctype html>
<html lang="ca">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Detall d'esdeveniment — Administració Espai Econòmic</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
<link rel="stylesheet" href="/css/admin.css?v=77">
</head>
<body>
<div class="admin-shell">
  <div class="admin-topbar">
    <a href="/admin/index.html" class="admin-link-back">← Tots els esdeveniments</a>
  </div>

  <div class="admin-topbar admin-topbar--evento">
    <h1 id="titol-evento">Carregant…</h1>
  </div>

  <form id="form-evento-editar" class="admin-form">
    <div class="camps-traduccio">
      <div class="camp-traduccio">
        <label for="nombre">Nom (català)</label>
        <textarea id="nombre" name="nombre" rows="2" required></textarea>
      </div>
      <div class="camp-traduccio">
        <label for="nombre_es">Nom (castellà)</label>
        <textarea id="nombre_es" name="nombre_es" rows="2"></textarea>
      </div>
      <div class="camp-traduccio">
        <label for="nombre_en">Nom (anglès)</label>
        <textarea id="nombre_en" name="nombre_en" rows="2"></textarea>
      </div>
    </div>

    <label for="fecha">Data de l'esdeveniment</label>
    <input type="datetime-local" id="fecha" name="fecha" required>

    <div class="camps-traduccio">
      <div class="camp-traduccio">
        <label for="descripcion">Descripció (català)</label>
        <textarea id="descripcion" name="descripcion" rows="2"></textarea>
      </div>
      <div class="camp-traduccio">
        <label for="descripcion_es">Descripció (castellà)</label>
        <textarea id="descripcion_es" name="descripcion_es" rows="2"></textarea>
      </div>
      <div class="camp-traduccio">
        <label for="descripcion_en">Descripció (anglès)</label>
        <textarea id="descripcion_en" name="descripcion_en" rows="2"></textarea>
      </div>
    </div>

    <label for="precio">Preu (€)</label>
    <input type="number" id="precio" name="precio" min="0.01" step="0.01" required>

    <label for="aforo_total">Aforament total</label>
    <input type="number" id="aforo_total" name="aforo_total" min="1" step="1" required>

    <label for="fecha_limite_compra">Data límit de compra</label>
    <input type="datetime-local" id="fecha_limite_compra" name="fecha_limite_compra" required>

    <label for="estado">Estat</label>
    <select id="estado" name="estado">
      <option value="abierto">Obert</option>
      <option value="cerrado">Tancat</option>
    </select>

    <button type="submit" class="btn-primary">Desar canvis</button>
    <button type="button" id="btn-eliminar-evento" class="btn-primary btn-primary--perillos">Eliminar esdeveniment</button>
    <p id="error-evento-editar" class="form-error"></p>
  </form>

  <div class="admin-topbar" style="margin-top:32px;">
    <h2 style="font-family:var(--font-sans); font-size:14px; text-transform:uppercase; letter-spacing:0.05em; color:var(--dark-muted);">Compres</h2>
    <a id="link-export-csv" class="btn-secundari" href="#">Exportar CSV</a>
  </div>

  <div class="admin-table-scroll admin-table-scroll--compras">
    <table class="admin-table admin-table--compras">
      <thead>
        <tr>
          <th>Comprador</th>
          <th>Email</th>
          <th>Quantitat</th>
          <th>Import</th>
          <th>Estat</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="taula-compras"></tbody>
    </table>
  </div>
</div>
<script src="/js/admin.js?v=55"></script>
</body>
</html>
